version: "2"

linters:
  default: standard
  enable:
    - lll
    - errorlint
    - bodyclose
    - misspell
    - revive
  settings:
    lll:
      line-length: 80
      tab-width: 4
    misspell:
      locale: US
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true

formatters:
  enable:
    - gofmt
    - goimports
